[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "ui*"]

[project]
name = "partlabeler"
version = "0.2.1"
description = "Build labeled datasets of industrial parts from videos and image folders: click-to-box, tracking and matching (SAM 3, DINOv3), plus automatic Teach & Transfer (RF-DETR)"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# torch/torchvision are installed separately from the PyTorch CUDA index (see README).
dependencies = [
    "transformers>=5.17",
    "accelerate",
    "huggingface_hub",
    "av",
    "opencv-python-headless",
    "numpy",
    "pillow",
    "pycocotools",
    "supervision",
    "scikit-learn",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",                      # file uploads to the integration API (/api/v1)
    "anywidget",
    "jupyter-ui-poll",
    "typer",
    "httpx",
    "timm>=1.0.20",
]

[project.optional-dependencies]
teach = ["rfdetr[train]==1.11.0", "albumentations", "faster-coco-eval"]
onnx = ["rfdetr[onnx]==1.11.0", "onnxconverter-common"]
dev = ["pytest", "playwright", "jupyterlab"]

[tool.uv]
# RF-DETR's train extra pulls in the Roboflow SDK, which only uploads models to Roboflow (PartLabeler never does):
# left out, with its packages. uv reads this when run in this folder, as the installers and updates do.
override-dependencies = ["roboflow ; sys_platform == 'never'"]

[project.scripts]
partlabeler = "engine.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

        el("bracket"),
        { opacity: 0, scale: 1.4 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },

        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.8, ease: "expo.out" },

        el("bracket"),

        { clipPath: "inset(0px 24px 0px 24px)", duration: 0.35, ease: "power3.out" },

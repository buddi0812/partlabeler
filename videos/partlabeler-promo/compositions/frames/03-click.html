    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";

        function byId(id) {
          return document.getElementById(id);
        }

        var rule = byId("03-click-rule");
        var eyebrow = byId("03-click-eyebrow");
        var h2Line = byId("03-click-h2-line");
        var bodyWords = byId("03-click-body").querySelectorAll("span");
        var metric = byId("03-click-metric");
        var stat = byId("03-click-stat");
        var value = byId("03-click-value");
        var label = byId("03-click-label");
        var dot = byId("03-click-dot");
        var captionText = byId("03-click-caption-text");

        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-2.3s): recording plays, cursor glides to the bolt.
        // "STEP 1" + "Click a part." reveal as the cursor starts moving.
        tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.2);
        tl.fromTo(
          eyebrow,
          { opacity: 0, x: -16 },
          { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
          0.3,
        );
        tl.fromTo(
          h2Line,
          { yPercent: 110 },
          { yPercent: 0, duration: 0.7, ease: "power3.out" },
          0.5,
        );

        // Scene 2 (2.3-3.4s): the click lands, the clip zooms in (baked),
        // mask + box appear. The explanation line rises word by word.
        for (var i = 0; i < bodyWords.length; i += 1) {
          tl.fromTo(
            bodyWords[i],
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            2.35 + i * 0.06,
          );
        }

        // Scene 3 (3.4-5.0s): the 0.08 s card pops (spring-pop, smooth settle),
        // the numeral counts up (count-up block rows), lands with one pulse.
        tl.fromTo(
          metric,
          { opacity: 0, scale: 0, y: 24 },
          { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" },
          3.5,
        );
        tl.fromTo(
          label,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
          3.7,
        );

        var COUNT_AT = 3.62;
        var COUNT = 0.9;
        var FPS = 30;
        var END = 0.08;
        var lastFrame = Math.max(1, Math.round(COUNT * FPS));
        var countEase = gsap.parseEase("sine.inOut");
        var prevText = value.textContent;
        for (var f = 0; f <= lastFrame; f += 1) {
          var text = (END * countEase(f / lastFrame)).toFixed(2);
          if (f === lastFrame) text = END.toFixed(2);
          if (text !== prevText) {
            tl.set(value, { textContent: text }, COUNT_AT + COUNT * (f / lastFrame));
            prevText = text;
          }
        }

        var PULSE_HALF = 0.165;
        tl.to(stat, { scale: 1.07, duration: PULSE_HALF, ease: "power3.out" }, COUNT_AT + COUNT);
        tl.to(
          stat,
          { scale: 1, duration: PULSE_HALF, ease: "power2.out" },
          COUNT_AT + COUNT + PULSE_HALF,
        );

        // Scene 4 (5.0-7.0s): the recording accepts all three; provenance
        // caption arrives under the window, then hold.
        tl.fromTo(
          dot,
          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
          5.05,
        );
        tl.fromTo(
          captionText,
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          5.1,
        );

        // hold to the fixed 7 s duration
        tl.set({}, {}, 7);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["03-click"] = tl;
      })();

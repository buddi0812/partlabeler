    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";

        var ID = "06-export-transfer";
        function el(name) {
          return document.getElementById(ID + "-" + name);
        }

        var tl = gsap.timeline({ paused: true });

        /* ---------- Camera: steady slow push-in across the whole 8 s ---------- */
        // (no camera push: the video direction bans slow back-half pushes)

        /* ---------- Scene 1 (0.0-2.2s): eyebrow, then pills assemble ---------- */
        tl.fromTo(
          el("eyebrow-format"),
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          0.05,
        );

        // center-outward-expansion, direct-into-slot (partially-spread) form:
        // each pill starts START_PROGRESS of the way out from the row's center
        // and expands to its own flex slot (x: 0). Offsets are index-based so
        // the start state is deterministic and independent of font timing.
        var PILL_COUNT = 5;
        var CENTER_INDEX = (PILL_COUNT - 1) / 2;
        var SLOT_PITCH = 230; // approx. px between pill slot centers
        var START_PROGRESS = 0.35;
        var EXPAND_DUR = 1.1;
        var EXPAND_EASE = "power3.out";
        var PILLS_AT = 0.3;
        var PILL_STAGGER = 0.15;

        for (var i = 0; i < PILL_COUNT; i += 1) {
          var startX = (CENTER_INDEX - i) * SLOT_PITCH * (1 - START_PROGRESS);
          tl.fromTo(
            el("pill-" + i),
            { x: startX, y: 0, scale: 0.6, opacity: 0 },
            { x: 0, y: 0, scale: 1, opacity: 1, duration: EXPAND_DUR, ease: EXPAND_EASE },
            PILLS_AT + i * PILL_STAGGER,
          );
        }

        /* ---------- Scene 2 (2.2-4.6s): triptych + drawn arrows ---------- */
        tl.fromTo(
          el("eyebrow-teach"),
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          2.2,
        );

        var CARD_AT = [2.4, 3.1, 3.8];
        var CARD_DUR = 0.7;
        for (var c = 0; c < CARD_AT.length; c += 1) {
          tl.fromTo(
            el("card-" + (c + 1)),
            { opacity: 0, y: 36, scale: 0.97 },
            { opacity: 1, y: 0, scale: 1, duration: CARD_DUR, ease: "power3.out" },
            CARD_AT[c],
          );
        }

        // svg-path-draw: dasharray = measured length, dashoffset length -> 0.
        function measure(path, fallback) {
          var len = 0;
          try {
            len = path.getTotalLength();
          } catch (e) {
            len = 0;
          }
          if (!(len > 0)) len = fallback;
          path.style.strokeDasharray = String(len);
          path.style.strokeDashoffset = String(len);
          return len;
        }

        var SHAFT_DUR = 0.4;
        var HEAD_DUR = 0.18;
        var SHAFT_AT = [2.85, 3.55];
        for (var a = 0; a < SHAFT_AT.length; a += 1) {
          var shaft = el("arrow-" + (a + 1) + "-shaft");
          var head = el("arrow-" + (a + 1) + "-head");
          var shaftLen = measure(shaft, 86);
          var headLen = measure(head, 40);
          tl.fromTo(
            shaft,
            { strokeDashoffset: shaftLen },
            { strokeDashoffset: 0, duration: SHAFT_DUR, ease: "power2.out" },
            SHAFT_AT[a],
          );
          // head starts at ~75% of the shaft draw so the stroke reads continuous
          tl.fromTo(
            head,
            { strokeDashoffset: headLen },
            { strokeDashoffset: 0, duration: HEAD_DUR, ease: "power2.out" },
            SHAFT_AT[a] + SHAFT_DUR * 0.75,
          );
        }

        /* ---------- Scene 3 (4.6-6.4s): 0.94 count-up + label ---------- */
        // Adapted from the count-up block: arrival, frame-row count on a
        // sine.inOut curve (tl.set per 30 fps row, seek-safe), one landing pulse.
        var stat = el("stat");
        var statValue = el("stat-value");
        var STAT_AT = 4.6;
        var ARRIVAL = 0.38;
        var COUNT = 1.3;
        var PULSE_HALF = 0.165;
        var FPS = 30;
        var END_VALUE = 0.94;
        var DECIMALS = 2;

        tl.fromTo(
          stat,
          { opacity: 0, y: 24, scale: 0.98 },
          { opacity: 1, y: 0, scale: 1, duration: ARRIVAL, ease: "power3.out" },
          STAT_AT,
        );

        var lastFrame = Math.max(1, Math.round(COUNT * FPS));
        var countEase = gsap.parseEase("sine.inOut");
        statValue.textContent = (0).toFixed(DECIMALS);
        for (var f = 0; f <= lastFrame; f += 1) {
          var p = f / lastFrame;
          var row = (END_VALUE * countEase(p)).toFixed(DECIMALS);
          tl.set(statValue, { textContent: row }, STAT_AT + COUNT * p);
        }

        tl.to(stat, { scale: 1.07, duration: PULSE_HALF, ease: "power3.out" }, STAT_AT + COUNT);
        tl.to(
          stat,
          { scale: 1, duration: PULSE_HALF, ease: "power2.out" },
          STAT_AT + COUNT + PULSE_HALF,
        );

        tl.fromTo(
          el("stat-label"),
          { opacity: 0, x: -16 },
          { opacity: 1, x: 0, duration: 0.55, ease: "power2.out" },
          4.85,
        );

        /* ---------- Scene 4 (6.4-8.0s): hold; only the camera push continues ---------- */

        window.__timelines = window.__timelines || {};
        window.__timelines["06-export-transfer"] = tl;
      })();
    </script>

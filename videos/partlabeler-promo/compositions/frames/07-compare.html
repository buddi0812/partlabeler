  <script>
    (function () {
      var ID = "07-compare";
      var root = document.querySelector('[data-composition-id="07-compare"]') || document;

      // Class names start with a digit, so select them by attribute (no CSS escaping needed).
      function c(name) {
        return '[class~="' + ID + "-" + name + '"]';
      }
      function one(sel, scope) {
        return (scope || root).querySelector(sel);
      }
      function all(sel, scope) {
        return Array.prototype.slice.call((scope || root).querySelectorAll(sel));
      }

      var ROW_START = 1.2; // Scene 2 begins
      var ROW_GAP = 1.0; // ~1 row per second
      var ROW_H = 88;
      var BODY_H = 528; // 6 rows x 88px
      var FOOT_AT = 7.2; // Scene 3 begins

      function bandInset(bottom) {
        return "inset(0px 0px " + bottom + "px 0px round 14px)";
      }

      var tl = gsap.timeline({ paused: true });

      var cam = one(c("cam"));
      var band = one(c("band"));

      // Macro camera: a faint push-in under the whole build (edges stay >= 64px from the frame).
      // (no camera push: the video direction bans slow back-half pushes)

      // Scene 1 (0.0-1.2s): headline + header row arrive together; PartLabeler column pre-tinted.
      tl.fromTo(
        one(c("title")),
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.08
      );
      tl.fromTo(band, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.22);
      tl.fromTo(
        all(c("hcell")),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.07 },
        0.3
      );

      // Scene 2 (1.2-7.2s): six rows, one per second. Rule draws + label mask-wipes from the left,
      // competitor cells fade in left to right, the teal column extends, PartLabeler's cell lands last.
      all(c("body-row")).forEach(function (row, i) {
        var t = ROW_START + i * ROW_GAP;

        tl.fromTo(
          one(c("rule"), row),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.6, ease: "power2.out" },
          t
        );
        tl.fromTo(
          one(c("label-text"), row),
          { clipPath: "inset(-25% 100% -25% 0%)", x: -14 },
          { clipPath: "inset(-25% 0% -25% 0%)", x: 0, duration: 0.5, ease: "power3.out" },
          t
        );
        tl.fromTo(
          all(c("them"), row),
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.09 },
          t + 0.18
        );
        tl.fromTo(
          band,
          { clipPath: bandInset(BODY_H - ROW_H * i) },
          {
            clipPath: bandInset(BODY_H - ROW_H * (i + 1)),
            duration: 0.45,
            ease: "power2.inOut",
            immediateRender: false,
          },
          t + 0.4
        );

        // PartLabeler cell: success-check draw (smooth, no overshoot) and/or bold teal text.
        var us = one(c("us"), row);
        var tUs = t + 0.56;
        var check = one(c("check"), us);
        var strong = one(c("strong"), us);

        if (check) {
          tl.fromTo(
            check,
            { opacity: 0, scale: 0.72, filter: "blur(6px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.34, ease: "power2.out" },
            tUs
          );
          var tick = one("path", check);
          var len = 36.5;
          try {
            len = tick.getTotalLength() || len;
          } catch (e) {}
          tick.style.strokeDasharray = len + " " + len;
          tl.fromTo(
            tick,
            { strokeDashoffset: len },
            { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
            tUs + 0.12
          );
        }

        if (strong) {
          if (check) {
            tl.fromTo(
              strong,
              { opacity: 0, x: -10 },
              { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" },
              tUs + 0.22
            );
          } else {
            tl.fromTo(
              strong,
              { opacity: 0, scale: 0.8, filter: "blur(6px)" },
              { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.out" },
              tUs
            );
          }
        }
      });

      // Scene 3 (7.2-9.0s): the footnote fades in bottom-left, then the table holds.
      tl.fromTo(
        one(c("foot")),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" },
        FOOT_AT
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["07-compare"] = tl;
    })();
  </script>

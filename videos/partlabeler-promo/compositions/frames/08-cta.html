        var headline = byId("08-cta-headline");

        var wordmark = byId("08-cta-wordmark");
        var credit = byId("08-cta-credit");

        // ---- Phase timing (seconds, frame-local) ----
        var WORDS_AT = 0.1; // Scene 1: headline reveals left
        var DEMOTE_AT = 1.2; // Scene 2: headline demotes
        var CHIP_AT = 1.4; //          ">" chip spring-pops
        var STRETCH_AT = 1.75; //      chip stretches into the wide pill
        var CARET_ON = 2.2;
        var TYPE_START = 2.35; //      command types
        var TYPE_END = 3.05;
        var ALT_AT = 3.25; // Scene 3: Linux / Colab line
        var MARK_AT = 4.6; // Scene 4: bracket draws as the logo mark
        var WORDMARK_AT = 5.15; //     wordmark locks up beside it
        var CREDIT_AT = 5.6; //        credit fades in, then hold

        // ---- Typing table: built once, synchronously (seek-safe) ----
        var FULL = "install_windows.bat";
        var seed = 0x08c7a5;
        function rnd() {
          seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
          return seed / 4294967296;
        }
        var gaps = [];
        var gapTotal = 0;
        for (var i = 0; i < FULL.length; i += 1) {
          var ch = FULL.charAt(i);
          var g = 0.8 + rnd() * 0.6;
          if (ch === "_" || ch === ".") g += 0.9; // small beat at word breaks
          gaps.push(g);
          gapTotal += g;
        }
        var rows = [{ t: 0, n: 0 }];
        var acc = 0;
        for (i = 0; i < gaps.length; i += 1) {
          rows.push({ t: TYPE_START + (acc / gapTotal) * (TYPE_END - TYPE_START), n: i + 1 });
          acc += gaps[i];
        }
        function charsAt(time) {
          for (var r = rows.length - 1; r >= 0; r -= 1) {
            if (time >= rows[r].t - 0.001) return rows[r].n;
          }
          return 0;

            0.15 + idx * 0.12,

        // Scene 1 (0.0-1.2): headline reveals word by word from the left.
        words.forEach(function (word, idx) {
          tl.fromTo(

            { opacity: 0, x: -32 },
            { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
            WORDS_AT + idx * 0.09,

        });

        // Scene 2 (1.2-3.2): headline demotes (scale down + lift) to make room.
        tl.fromTo(
          headline,
          { y: 44, scale: 1 },
          { y: 0, scale: 0.78, duration: 0.75, ease: "power2.inOut" },
          DEMOTE_AT,

          { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },

          { clipPath: OPEN_CLIP, duration: 0.6, ease: "power3.inOut" },

            duration: TYPE_END,
            ease: "none",
            onUpdate: function () {
              typedEl.textContent = FULL.slice(0, charsAt(driver.t));

        );

        var BLINK_STEPS = [3.4, 3.85, 4.3, 4.75, 5.2, 5.65, 6.1, 6.55];
        BLINK_STEPS.forEach(function (at, idx) {
          tl.set(caret, { opacity: idx % 2 === 0 ? 0 : 1 }, at);
        });

        // Scene 3 (3.2-4.6): Linux / Colab line reveals under the pill.
        segs.forEach(function (seg, idx) {
